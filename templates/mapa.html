<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa de Clientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; }

  .panel {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    width: 92%;
    max-width: 360px;
  }

  .panel b { display: block; margin-bottom: 6px; }
  .panel input, .panel button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ddd;
  }

  .panel button {
    background: #1976d2;
    color: white;
    border: none;
    cursor: pointer;
  }

  .panel button.secondary {
    background: #e0e0e0;
    color: #333;
  }

  .go-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 10px;
    background: #e53935;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
  }

  .modal-content {
    background: white;
    position: absolute;
    bottom: 0;
    width: 100%;
    max-height: 85%;
    padding: 15px;
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
  }

  .modal-content input,
  .modal-content textarea,
  .modal-content button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
  }

  .modal-content textarea {
    height: 80px;
    resize: none;
  }
</style>
</head>

<body>

<div class="panel">
  <b>Buscar cliente por SERIALNUMBER</b>
  <input id="serial" type="text" placeholder="Ej: 12345678" />
  <button onclick="buscar()">Buscar</button>
  <button class="secondary" onclick="abrirReporte()">Reportar medidor</button>
</div>

<div id="map"></div>

<!-- MODAL REPORTE -->
<div id="modalReporte" class="modal">
  <div class="modal-content">
    <h3>📋 Reportar medidor</h3>

    <p id="ubicacionTexto" style="font-size:12px; color:#666;"></p>

    <input id="rep_aparato" type="text" placeholder="Número de aparato" />
    <input id="rep_mru" type="text" placeholder="MRU" />
    <input id="rep_ref" type="text" placeholder="Aparato de referencia" />
    <textarea id="rep_comentario" placeholder="Comentario"></textarea>

    <!-- 🔥 NUEVO INPUT DE FOTO -->
    <input id="rep_foto" type="file" accept="image/*">

    <button onclick="enviarReporte()">Enviar</button>
    <button class="secondary" onclick="cerrarReporte()">Cancelar</button>
  </div>
</div>

<script>
  const map = L.map('map', { zoomControl: false }).setView([13.7, -89.2], 10);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);

  let userLat = null;
  let userLon = null;

  const redIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;

      L.marker([userLat, userLon])
        .addTo(map)
        .bindPopup("📍 Tu ubicación");

      map.setView([userLat, userLon], 13);
    });
  }

  function pintarClientes(data, esBusqueda = false) {
    markersLayer.clearLayers();

    if (!data || data.length === 0) {
      alert("No se encontró el cliente");
      return;
    }

    const bounds = [];

    data.forEach(c => {

      const lat = parseFloat(c.latitude);
      const lon = parseFloat(c.longitude);

      if (isNaN(lat) || isNaN(lon)) return;

      const marker = L.marker([lat, lon], esBusqueda ? { icon: redIcon } : {})
        .addTo(markersLayer);

      let popupHtml = `
    👤 Cliente<br>
    Serial: ${c.serialnumber}<br>
    MRU: ${c.mru || 'N/A'}<br>
    Lat: ${c.latitude}<br>
    Lon: ${c.longitude}
`;

      if (userLat && userLon && esBusqueda) {
        const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${lat},${lon}`;
        popupHtml += `<br><a class="go-btn" target="_blank" href="${gmaps}">🧭 Cómo llegar</a>`;
      }

      marker.bindPopup(popupHtml);
      bounds.push([lat, lon]);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }

  function buscar() {
    const serial = document.getElementById("serial").value.trim();

    if (!serial) {
      alert("Ingresa un SERIALNUMBER válido");
      return;
    }

    fetch(`/api/clientes?serial=${serial}`)
      .then(r => r.json())
      .then(data => pintarClientes(data, true))
      .catch(err => {
        console.error(err);
        alert("Error al buscar cliente");
      });
  }

  function abrirReporte() {
    document.getElementById("modalReporte").style.display = "block";

    if (userLat && userLon) {
      document.getElementById("ubicacionTexto").innerText =
        `📍 Ubicación: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
    } else {
      document.getElementById("ubicacionTexto").innerText =
        "⚠️ Ubicación no disponible";
    }
  }

  function cerrarReporte() {
    document.getElementById("modalReporte").style.display = "none";
  }

  // 🔥 FUNCIÓN MODIFICADA PARA SOPORTAR FOTO
  function enviarReporte() {
  const aparato = document.getElementById("rep_aparato").value.trim();
  const mru = document.getElementById("rep_mru").value.trim();
  const ref = document.getElementById("rep_ref").value.trim();
  const comentario = document.getElementById("rep_comentario").value.trim();
  const foto = document.getElementById("rep_foto").files[0];

  if (!aparato || !mru) {
    alert("Aparato y MRU son obligatorios");
    return;
  }

  if (!userLat || !userLon) {
    alert("No se pudo obtener ubicación GPS");
    return;
  }

  const formData = new FormData();

  formData.append("aparato", aparato);
  formData.append("mru", mru);
  formData.append("referencia", ref);
  formData.append("comentario", comentario);
  formData.append("latitud", userLat);
  formData.append("longitud", userLon);
  formData.append("fecha", new Date().toISOString());

  if (foto) {
    formData.append("foto", foto);
  }

  fetch("/api/reportes", {
    method: "POST",
    body: formData
  })
  .then(r => r.json())
  .then(res => {
    console.log(res);
    alert("Reporte enviado correctamente 📍");
    cerrarReporte();
  })
  .catch(err => {
    console.error(err);
    alert("Error al enviar reporte");
  });

}
</script>

</body>
</html>
