<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa de Clientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; }

  .panel {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    width: 92%;
    max-width: 360px;
  }

  .panel b { display: block; margin-bottom: 6px; }
  .panel input, .panel button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ddd;
  }

  .panel button {
    background: #1976d2;
    color: white;
    border: none;
    cursor: pointer;
  }

  .panel button.secondary {
    background: #e0e0e0;
    color: #333;
  }

  .go-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 10px;
    background: #e53935;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
  }

  .modal-content {
    background: white;
    position: absolute;
    bottom: 0;
    width: 100%;
    max-height: 85%;
    padding: 15px;
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
  }

  .modal-content input,
  .modal-content textarea,
  .modal-content select,
  .modal-content button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    box-sizing: border-box;
  }

  .modal-content label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
    color: #333;
  }

  .modal-content textarea {
    height: 80px;
    resize: none;
  }
</style>
</head>

<body>

<div class="panel">
  <b>Buscar cliente por SERIALNUMBER</b>
  <input id="serial" type="text" placeholder="Ej: 12345678" />
 <button onclick="buscar()">Buscar</button>

<button onclick="verMRU()">Ver MRU</button>

<button id="btnRevisiones"
        onclick="verRevisiones()"
        style="display:none; background:#388e3c;">
  📍 Ver Revisiones
</button>

<button id="btnOptimizarRuta"
        onclick="optimizarRutaRevisiones()"
        style="display:none; background:#1565c0;">
  🧭 Optimizar ruta
</button>

<button class="secondary" onclick="abrirReporte()">Reportar medidor</button>
</div>

<div id="map"></div>

<!-- MODAL REPORTE -->
<div id="modalReporte" class="modal">
  <div class="modal-content">
    <h3>📋 Reportar medidor</h3>

    <p id="ubicacionTexto" style="font-size:12px; color:#666;"></p>

    <input id="rep_aparato" type="text" placeholder="Número de aparato" />
    <input id="rep_mru" type="text" placeholder="MRU" />
    <input id="rep_ref" type="text" placeholder="Aparato de referencia" />

    <label for="rep_condicion">Condición encontrada en campo</label>
    <select id="rep_condicion">
      <option value="" selected disabled>Selecciona una condición</option>
      <option value="CO">CO — Consumo cero</option>
      <option value="AA">AA — Aire acondicionado</option>
      <option value="MD">MD — Medidor dañado</option>
      <option value="LD">LD — Línea directa</option>
      <option value="AP24">AP24 — AP encendida 24 h</option>
      <option value="IL">IL — Suministros ilegales</option>
      <option value="OT">OT — Otros</option>
    </select>

    <label for="rep_prioridad">Prioridad de atención</label>
    <select id="rep_prioridad">
      <option value="" selected disabled>Selecciona una prioridad</option>
      <option value="1">1 — Urgente / Alta</option>
      <option value="2">2 — Media alta</option>
      <option value="3">3 — Media baja</option>
      <option value="4">4 — Puede esperar</option>
    </select>

    <textarea id="rep_comentario" placeholder="Comentario"></textarea>

    <!-- 🔥 NUEVO INPUT DE FOTO -->
    <input id="rep_foto" type="file" accept="image/*">

    <button onclick="enviarReporte()">Enviar</button>
    <button class="secondary" onclick="cerrarReporte()">Cancelar</button>
  </div>
</div>

<!-- MODAL EJECUTAR REVISION -->
<div id="modalEvidencia" class="modal">

  <div class="modal-content">

    <h3>🔎 Ejecutar revisión</h3>

    <p id="evidenciaDatos"
       style="font-size:14px; color:#555;">
    </p>

    <label>¿Medidor encontrado?</label>

    <select id="evidenciaEncontrado"
            style="
              width:100%;
              padding:12px;
              margin-top:8px;
              font-size:16px;
              border-radius:8px;
              border:1px solid #ddd;
            ">

      <option value="true">Sí</option>
      <option value="false">No</option>

    </select>

    <textarea
      id="evidenciaComentario"
      placeholder="¿Qué encontró en campo?"
      style="
        width:100%;
        height:100px;
        margin-top:10px;
        padding:10px;
        box-sizing:border-box;
      ">
    </textarea>

    <label style="display:block; margin-top:10px;">
      📷 Evidencia fotográfica
    </label>

    <input
      id="evidenciaFotos"
      type="file"
      accept="image/*"
      capture="environment"
      multiple
    >

    <p id="evidenciaUbicacion"
       style="font-size:12px; color:#666;">
       ⏳ Obteniendo ubicación GPS...
    </p>

    <button
      id="btnGuardarEvidencia"
      onclick="guardarEvidencia()">
      💾 Guardar evidencia
    </button>

    <button
      class="secondary"
      onclick="cerrarEvidencia()">
      Cancelar
    </button>

  </div>

</div>

<script>
  const map = L.map('map', { zoomControl: false }).setView([13.7, -89.2], 10);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);
  const rutaLayer = L.layerGroup().addTo(map);
  cargarMisRevisiones();

  let userLat = null;
  let userLon = null;

  // Validar revisiones asignadas al usuario
function cargarMisRevisiones(){

    fetch("/api/mis_revisiones")
    .then(r => r.json())
    .then(data => {

        if(data.cantidad > 0){

            const boton = document.getElementById("btnRevisiones");

            boton.style.display = "block";

            boton.innerText =
            `📍 Ver Revisiones (${data.cantidad})`;

        }

    })
    .catch(err=>{
        console.error("Error revisiones:",err);
    });

}

  // Marcador de la ubicación actual
  let marcadorUsuario = null;

  // Para centrar el mapa solo una vez
  let primeraUbicacion = true;

  const redIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });

  if (navigator.geolocation) {

    navigator.geolocation.watchPosition(

        function(pos){

            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;

            actualizarTextoUbicacion();

            if(!marcadorUsuario){

                marcadorUsuario = L.marker([userLat,userLon])
                    .addTo(map)
                    .bindPopup("📍 Tu ubicación");

            }else{

                marcadorUsuario.setLatLng([userLat,userLon]);

            }

            if(primeraUbicacion){

                map.setView([userLat,userLon],13);
                primeraUbicacion = false;

            }

        },

        function(error){

            console.error("Error GPS:",error);

        },

        {

            enableHighAccuracy:true,
            maximumAge:0,
            timeout:10000

        }

    );

}

  function pintarClientes(data, esBusqueda = false) {
    markersLayer.clearLayers();

    if (!data || data.length === 0) {
      alert("No se encontró el cliente");
      return;
    }

    const bounds = [];

    data.forEach(c => {

      const lat = parseFloat(c.latitude);
      const lon = parseFloat(c.longitude);

      if (isNaN(lat) || isNaN(lon)) return;

      const marker = L.marker([lat, lon], esBusqueda ? { icon: redIcon } : {})
        .addTo(markersLayer);

      let popupHtml = `
    👤 Cliente<br>
    Serial: ${c.serialnumber}<br>
    MRU: ${c.mru || 'N/A'}<br>
    Lat: ${c.latitude}<br>
    Lon: ${c.longitude}
`;

      if (userLat && userLon && esBusqueda) {

  const gmaps = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${lat},${lon}`;

  // enlace para compartir ubicación exacta del medidor
  const compartir = `https://www.google.com/maps?q=${lat},${lon}`;

  popupHtml += `
    <br>
    <a class="go-btn" target="_blank" href="${gmaps}">
      🧭 Cómo llegar
    </a>

    <br><br>

    <a class="go-btn"
       style="background:#43a047"
       target="_blank"
       href="${compartir}">
       📤 Compartir ubicación
    </a>
  `;
}

      marker.bindPopup(popupHtml);
      bounds.push([lat, lon]);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }
//----------------------------------------------
function dibujarRutaMRU(mru) {

  rutaLayer.clearLayers();

  fetch(`/api/mru_ruta?mru=${mru}`)
    .then(r => r.json())
    .then(datos => {

      if (!datos || datos.length < 2) {
        return;
      }

      const coordenadas = [];

      datos.forEach((p, index) => {

        const lat = parseFloat(p.latitude);
        const lon = parseFloat(p.longitude);

        if (isNaN(lat) || isNaN(lon)) return;

        coordenadas.push([lat, lon]);

        // 🟢 PARADA (optimizada para móvil)
        const popup = `
          <b>Parada #${index + 1}</b><br>
          Serial: ${p.serialnumber || 'N/A'}<br>
          MRU: ${p.mru || ''}
        `;

        // 🔵 CÍRCULO PEQUEÑO VISUAL
        L.circleMarker([lat, lon], {
          radius: 5,
          color: "#1976d2",
          fillColor: "#1976d2",
          fillOpacity: 0.8,
          weight: 2
        })
        .addTo(rutaLayer)
        .bindPopup(popup);

        // 🟠 ÁREA INVISIBLE GRANDE (mejora toque en móvil)
        L.circleMarker([lat, lon], {
          radius: 12,
          color: "transparent",
          fillOpacity: 0
        })
        .addTo(rutaLayer)
        .bindPopup(popup);
      });

      if (coordenadas.length < 2) return;

      // 🔵 LÍNEA DE RECORRIDO
      L.polyline(coordenadas, {
        color: 'blue',
        weight: 4,
        opacity: 0.7
      }).addTo(rutaLayer);

      // 🟢 INICIO
      const inicio = datos[0];

      L.marker([inicio.latitude, inicio.longitude], {
        icon: new L.Icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34]
        })
      })
      .addTo(rutaLayer)
      .bindPopup(`
        🟢 Inicio MRU<br>
        Serial: ${inicio.serialnumber || 'N/A'}<br>
        MRU: ${inicio.mru || ''}
      `);

      // 🔴 FIN
      const fin = datos[datos.length - 1];

      L.marker([fin.latitude, fin.longitude], {
        icon: redIcon
      })
      .addTo(rutaLayer)
      .bindPopup(`
        🔴 Fin MRU<br>
        Serial: ${fin.serialnumber || 'N/A'}<br>
        MRU: ${fin.mru || ''}
      `);

    })
    .catch(err => {
      console.error("Error cargando ruta MRU", err);
    });
}
//----------------------------------------------

  function buscar() {
    const serial = document.getElementById("serial").value.trim();

    if (!serial) {
      alert("Ingresa un SERIALNUMBER válido");
      return;
    }

    fetch(`/api/clientes?serial=${serial}`)
      .then(r => r.json())
      .then(data => pintarClientes(data, true))
      .catch(err => {
        console.error(err);
        alert("Error al buscar cliente");
      });
}
//---------------------------------------------------------------
  function verMRU() {

  const mru = prompt("Ingrese la MRU que desea visualizar:");

  if (!mru) {
    return;
  }

  dibujarRutaMRU(mru.trim());

}
//------------------------------------------------------------------------
// ---------------- RUTA REVISIONES ASIGNADAS ----------------

// Datos de revisiones que se muestran en el mapa.
let revisionesRuta = [];
let rutaOptimizadaActiva = false;
let seleccionandoOrigenRuta = false;
let origenManualRuta = null;
let lineaRutaRevisiones = null;

function verRevisiones(){

    rutaLayer.clearLayers();
    revisionesRuta = [];
    rutaOptimizadaActiva = false;
    origenManualRuta = null;

    const botonOptimizar = document.getElementById("btnOptimizarRuta");
    if (botonOptimizar) botonOptimizar.style.display = "none";

    fetch("/api/ruta_revisiones")
    .then(r => {
        if (!r.ok) throw new Error("No se pudieron cargar las revisiones.");
        return r.json();
    })
    .then(datos => {

        if(!datos || datos.length === 0){
            alert("No tiene revisiones pendientes");
            return;
        }

        datos.forEach((p) => {
            const lat = parseFloat(p.latitud);
            const lon = parseFloat(p.longitud);
            if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return;
            revisionesRuta.push({ ...p, latitud: lat, longitud: lon });
        });

        if (revisionesRuta.length === 0) {
            alert("Las revisiones no tienen coordenadas válidas para dibujar la ruta.");
            return;
        }

        dibujarRevisionesRuta(revisionesRuta, false);
        if (botonOptimizar) botonOptimizar.style.display = "block";
    })
    .catch(err => {
        console.error("Error ruta revisiones:", err);
        alert("No fue posible cargar las revisiones. Intenta nuevamente.");
    });
}

// Distancia aproximada en línea recta entre dos coordenadas (metros).
function distanciaRutaMetros(a, b) {
    const R = 6371000;
    const rad = grados => grados * Math.PI / 180;
    const dLat = rad(b[0] - a[0]);
    const dLon = rad(b[1] - a[1]);
    const lat1 = rad(a[0]);
    const lat2 = rad(b[0]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

// Heurística inicial: desde el origen, visita siempre la OS pendiente más cercana.
function calcularOrdenCercano(origen, puntos) {
    const pendientes = puntos.slice();
    const orden = [];
    let actual = origen;
    while (pendientes.length) {
        let mejorIndice = 0;
        let mejorDistancia = Infinity;
        for (let i = 0; i < pendientes.length; i++) {
            const p = pendientes[i];
            const d = distanciaRutaMetros(actual, [p.latitud, p.longitud]);
            if (d < mejorDistancia) {
                mejorDistancia = d;
                mejorIndice = i;
            }
        }
        const siguiente = pendientes.splice(mejorIndice, 1)[0];
        orden.push(siguiente);
        actual = [siguiente.latitud, siguiente.longitud];
    }
    return orden;
}

function optimizarRutaRevisiones() {
    if (!revisionesRuta.length) {
        alert("Primero pulsa ‘Ver Revisiones’ para cargar las órdenes pendientes.");
        return;
    }

    if (userLat !== null && userLon !== null && Number.isFinite(userLat) && Number.isFinite(userLon)) {
        origenManualRuta = null;
        aplicarOptimizacionRuta([userLat, userLon]);
        return;
    }

    seleccionandoOrigenRuta = true;
    alert("No hay GPS disponible. Toca el mapa en el lugar donde deseas iniciar el recorrido.");
    map.once("click", function(e) {
        if (!seleccionandoOrigenRuta) return;
        seleccionandoOrigenRuta = false;
        origenManualRuta = [e.latlng.lat, e.latlng.lng];
        aplicarOptimizacionRuta(origenManualRuta);
    });
}

function aplicarOptimizacionRuta(origen) {
    if (!origen || !revisionesRuta.length) return;
    revisionesRuta = calcularOrdenCercano(origen, revisionesRuta);
    rutaOptimizadaActiva = true;
    dibujarRevisionesRuta(revisionesRuta, true);
}

function dibujarRevisionesRuta(puntos, optimizada) {
    rutaLayer.clearLayers();
    const coordenadas = [];

    puntos.forEach((p, index) => {
        const lat = p.latitud;
        const lon = p.longitud;
        coordenadas.push([lat, lon]);
        const esInicio = optimizada && index === 0;
        const esFin = optimizada && index === puntos.length - 1;
        const etiqueta = optimizada ? `Parada #${index + 1}` : `Revisión #${index + 1}`;
        const distintivo = esInicio ? "🟢 INICIO DEL RECORRIDO<br>" : (esFin ? "🔴 ÚLTIMA PARADA<br>" : "");
        const popup = `
            <b>${distintivo}📍 ${etiqueta}</b><br>
            Instalación: ${p.instalacion || ''}<br>
            Serial: ${p.serialnumber || ''}<br>
            Comentario: ${p.comentario || ''}<br><br>
            <button onclick="abrirEvidencia(${p.id})"
                style="width:100%;padding:10px;background:#388e3c;color:white;border:none;border-radius:6px;font-size:15px;">
                🔎 Ejecutar revisión
            </button>`;

        // Se conservan círculos y ventanas; no se agregan pines de inicio/fin.
        L.circleMarker([lat, lon], {
            radius: esInicio ? 9 : (esFin ? 8 : 6),
            color: esFin ? "#c62828" : (esInicio ? "#1b5e20" : "#388e3c"),
            fillColor: esFin ? "#e53935" : (esInicio ? "#00a000" : "#388e3c"),
            fillOpacity: 0.95,
            weight: esInicio || esFin ? 3 : 2
        }).addTo(rutaLayer).bindPopup(popup);

        // Área táctil amplia para facilitar la selección en teléfonos.
        L.circleMarker([lat, lon], {
            radius: 16,
            color: "transparent",
            fillColor: "#ffffff",
            fillOpacity: 0
        }).addTo(rutaLayer).bindPopup(popup);
    });

    if (coordenadas.length >= 2) {
        L.polyline(coordenadas, {
            color: optimizada ? "#1565c0" : "green",
            weight: 4,
            opacity: 0.8
        }).addTo(rutaLayer);
    }

    if (coordenadas.length === 1) {
        map.setView(coordenadas[0], 16);
    } else {
        map.fitBounds(coordenadas, { padding: [40, 40] });
    }

    if (optimizada) {
        const inicio = puntos[0];
        const fin = puntos[puntos.length - 1];
        alert(`Ruta ordenada por proximidad.\nInicio: instalación ${inicio.instalacion || 'N/D'} (serial ${inicio.serialnumber || 'N/D'}).\nÚltima parada: instalación ${fin.instalacion || 'N/D'} (serial ${fin.serialnumber || 'N/D'}).\n\nLa distancia se estima en línea recta; no considera calles ni tráfico.`);
    }
}

// ---------------------------------------------------------
// ---------------------------------------------------------
// EJECUTAR REVISION
// ---------------------------------------------------------

let ordenSeleccionada = null;


function abrirEvidencia(ordenId) {

    ordenSeleccionada = ordenId;

    document.getElementById("evidenciaDatos").innerHTML =
        "Orden de trabajo: <b>" + ordenId + "</b>";

    document.getElementById("evidenciaEncontrado").value = "true";

    document.getElementById("evidenciaComentario").value = "";

    document.getElementById("evidenciaFotos").value = "";

    actualizarUbicacionEvidencia();

    document.getElementById("modalEvidencia").style.display = "block";
}


function cerrarEvidencia() {

    document.getElementById("modalEvidencia").style.display = "none";

    ordenSeleccionada = null;
}


function actualizarUbicacionEvidencia() {

    const texto =
        document.getElementById("evidenciaUbicacion");

    if (userLat !== null && userLon !== null) {

        texto.innerText =
            `📍 GPS: ${userLat.toFixed(6)}, ${userLon.toFixed(6)}`;

    } else {

        texto.innerText =
            "⏳ Obteniendo ubicación GPS...";

    }
}

function guardarEvidencia() {

    if (!ordenSeleccionada) {

        alert("No se seleccionó una orden.");

        return;
    }

    const encontrado =
        document.getElementById("evidenciaEncontrado").value;

const comentario =
    document.getElementById("evidenciaComentario").value.trim();

const fotos =
    document.getElementById("evidenciaFotos").files;

const formData = new FormData();

formData.append("encontrado", encontrado);
formData.append("comentario", comentario);

if (fotos.length > 0) {

    formData.append("foto", fotos[0]);

}
    // Por ahora utilizamos la ubicación que ya tiene la aplicación
    if (userLat !== null && userLon !== null) {

        formData.append("latitud", userLat);
        formData.append("longitud", userLon);

    }


    fetch(
        `/api/ordenes/${ordenSeleccionada}/evidencia`,
        {
            method: "POST",
            body: formData
        }
    )

    .then(response => response.json())

    .then(data => {

     console.log("Respuesta evidencia:", data);

     if (data.error) {

        alert(data.error);

        return;
     }

    alert(data.mensaje);

    // Limpiar formulario
    document.getElementById("evidenciaComentario").value = "";
    document.getElementById("evidenciaFotos").value = "";
    document.getElementById("evidenciaEncontrado").value = "true";

    // Cerrar formulario
    cerrarEvidencia();

    })

    .catch(error => {

        console.error(
            "Error enviando evidencia:",
            error
        );

        alert(
            "Error al enviar la evidencia."
        );

    });

}


//------------------------------------------------------------------------

  function abrirReporte() {

    document.getElementById("modalReporte").style.display = "block";

    actualizarTextoUbicacion();

}

  function cerrarReporte() {
    document.getElementById("modalReporte").style.display = "none";
  }

  function actualizarTextoUbicacion() {

    const texto = document.getElementById("ubicacionTexto");

    if (!texto) return;

    if (userLat && userLon) {

        texto.innerText =
            `📍 Ubicación actual: ${userLat.toFixed(6)}, ${userLon.toFixed(6)}`;

    } else {

        texto.innerText = "⏳ Obteniendo ubicación GPS...";

    }

}

  // 🔥 FUNCIÓN MODIFICADA PARA SOPORTAR FOTO
  function enviarReporte() {

    const aparato = document.getElementById("rep_aparato").value.trim();
    const mru = document.getElementById("rep_mru").value.trim();
    const ref = document.getElementById("rep_ref").value.trim();
    const comentario = document.getElementById("rep_comentario").value.trim();
    const condicion = document.getElementById("rep_condicion").value;
    const prioridad = document.getElementById("rep_prioridad").value;
    const foto = document.getElementById("rep_foto").files[0];

    if (!aparato || !mru) {
    alert("Aparato y MRU son obligatorios");
    return;
}

if (!condicion) {
    alert("Debes seleccionar la condición encontrada en campo");
    return;
}

if (!prioridad) {
    alert("Debes seleccionar la prioridad de atención");
    return;
}


    const botonEnviar = document.querySelector("#modalReporte button");

    botonEnviar.disabled = true;
    botonEnviar.innerText = "Obteniendo ubicación...";

    navigator.geolocation.getCurrentPosition(

        function(pos){

            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;

            actualizarTextoUbicacion();

            const formData = new FormData();

            formData.append("aparato", aparato);
            formData.append("mru", mru);
            formData.append("referencia", ref);
            formData.append("comentario", comentario);
            formData.append("condicion", condicion);
            formData.append("prioridad", prioridad);
            formData.append("latitud", userLat);
            formData.append("longitud", userLon);
            formData.append("fecha", new Date().toISOString());

            if(foto){

                formData.append("foto", foto);

            }

            botonEnviar.innerText = "Enviando reporte...";

            fetch("/api/reportes",{

                method:"POST",
                body:formData

            })

            .then(async r => {
    const res = await r.json();

    if (!r.ok || res.error || res.status !== "ok") {
        throw new Error(res.error || "No se pudo guardar el reporte");
    }

    return res;
})

.then(res => {

    console.log(res);

    alert("Reporte enviado correctamente 📍");

    cerrarReporte();


                document.getElementById("rep_aparato").value="";
                document.getElementById("rep_mru").value="";
                document.getElementById("rep_ref").value="";
                document.getElementById("rep_comentario").value="";
                document.getElementById("rep_condicion").selectedIndex = 0;
                document.getElementById("rep_prioridad").selectedIndex = 0;
                document.getElementById("rep_foto").value="";

            })

            .catch(err=>{

                console.error(err);

                alert("Error al enviar reporte");

            })

            .finally(()=>{

                botonEnviar.disabled=false;
                botonEnviar.innerText="Enviar";

            });

        },

        function(error){

            console.error(error);

            botonEnviar.disabled=false;
            botonEnviar.innerText="Enviar";

            alert("No fue posible obtener la ubicación GPS.");

        },

        {

            enableHighAccuracy:true,
            timeout:30000,
            maximumAge:60000

        }

    );

}
</script>
